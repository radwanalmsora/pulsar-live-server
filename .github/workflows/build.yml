name: Build VSIX

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check
        run: npm run check

      - name: Smoke tests
        run: npm test

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --no-dependencies --out pulsar-live-server.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulsar-live-server-vsix
          path: pulsar-live-server.vsix

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: pulsar-live-server.vsix
          generate_release_notes: true

      - name: Publish to VS Marketplace (optional, needs VSCE_PAT secret)
        if: startsWith(github.ref, 'refs/tags/v') && env.VSCE_PAT != ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce publish --packagePath pulsar-live-server.vsix
